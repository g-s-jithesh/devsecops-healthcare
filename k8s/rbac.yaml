apiVersion: v1
kind: ServiceAccount
metadata:
  name: healthcare-sa
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: healthcare-read-only
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: healthcare-read-only-binding
subjects:
- kind: ServiceAccount
  name: healthcare-sa
roleRef:
  kind: Role
  name: healthcare-read-only
  apiGroup: rbac.authorization.k8s.io
